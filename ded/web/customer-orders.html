{% extends "base-dashboard.html" %}

{% block title %}Заказы покупателей{% endblock %}
{% block content %}
<script>
    let itemsList = [];
    let ordersList = [];
    let isViewing = false;

    async function loadItems() {
        try {
            const res = await fetch('/api/items/', { credentials: 'include' });
            const data = await res.json();
            itemsList = data.items || [];
        } catch (e) { itemsList = []; }
    }

    async function loadOrdersList() {
        try {
            const res = await fetch('/api/orders/', { credentials: 'include' });
            const data = await res.json();
            ordersList = data.orders || [];

            const clientSelect = document.getElementById('coClientId');
            if (clientSelect) {
                clientSelect.innerHTML = '<option value="">Выберите контрагента...</option>' +
                    ordersList.map(o => `<option value="${o.order_id}">${o.name}</option>`).join('');
            }
        } catch (e) { ordersList = []; }
    }

    async function loadCustomerOrders() {
        try {
            const response = await fetch('/api/customer-orders/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('customerOrdersTableBody');
            const list = data.customer_orders || [];

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Заказов пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            list.forEach(order => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${order.order_number}</td>
                    <td>${order.order_date ? new Date(order.order_date).toLocaleDateString('ru-RU') : '—'}</td>
                    <td>${order.order_id || '—'}</td>
                    <td>${order.executor_id || '—'}</td>
                    <td>${(order.total_amount || 0).toFixed(2)} ₽</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="viewCustomerOrder(${order.id})">👁️</button>
                        <button class="btn btn-sm btn-success" onclick="calculateCost(${order.id})">💰</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCustomerOrder(${order.id})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить заказы');
        }
    }

    function openAddCustomerOrderModal() {
        document.getElementById('modalTitle').textContent = 'Добавить заказ покупателя';
        document.getElementById('editCustomerOrderId').value = '';
        document.getElementById('customerOrderForm').reset();
        document.getElementById('coDate').valueAsDate = new Date();
        document.getElementById('coItemsContainer').innerHTML = '';
        addCustomerOrderItemRow();
        openModal('customerOrderModal');
    }

    function addCustomerOrderItemRow() {
        const container = document.getElementById('coItemsContainer');
        const rowId = Date.now();
        const row = document.createElement('div');
        row.className = 'co-item-row';
        row.id = `coItemRow_${rowId}`;

        const productOptions = itemsList
            .filter(i => i.item_type === 'Продукция')
            .map(i => `<option value="${i.item_id}">${i.name} (${i.code})</option>`)
            .join('');

        row.innerHTML = `
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: end;">
                <div class="form-group" style="margin:0;">
                    <label class="form-label" style="font-size:12px;">Продукция</label>
                    <select class="form-input co-item-select">
                        <option value="">Выберите...</option>
                        ${productOptions}
                    </select>
                </div>
                <div class="form-group" style="margin:0;">
                    <label class="form-label" style="font-size:12px;">Кол-во</label>
                    <input type="number" class="form-input co-item-qty" value="1" min="0.01" step="0.01">
                </div>
                <div class="form-group" style="margin:0;">
                    <label class="form-label" style="font-size:12px;">Цена, ₽</label>
                    <input type="number" class="form-input co-item-price" value="0" min="0" step="0.01">
                </div>
                <div class="form-group" style="margin:0;">
                    <label class="form-label" style="font-size:12px;">Скидка, %</label>
                    <input type="number" class="form-input co-item-discount" value="0" min="0" max="100" step="0.01">
                </div>
                <button type="button" class="btn btn-sm btn-danger"
                    onclick="this.parentElement.parentElement.remove()">✕</button>
            </div>
        `;
        container.appendChild(row);
    }

    async function saveCustomerOrder(event) {
        event.preventDefault();
        const editId = document.getElementById('editCustomerOrderId').value;

        const orderDate = document.getElementById('coDate').value;
        const orderNumber = document.getElementById('coNumber').value ||
            `CO-${Date.now().toString().slice(-6)}`;
        const clientId = document.getElementById('coClientId').value;
        const executorId = document.getElementById('coExecutorId').value;

        if (!orderDate) { showNotification('error', 'Ошибка', 'Укажите дату'); return; }
        if (!clientId) { showNotification('error', 'Ошибка', 'Выберите контрагента'); return; }
        if (!executorId) { showNotification('error', 'Ошибка', 'Укажите исполнителя (ID)'); return; }

        const items = [];
        document.querySelectorAll('.co-item-row').forEach(row => {
            const select = row.querySelector('.co-item-select');
            const qty = row.querySelector('.co-item-qty');
            const price = row.querySelector('.co-item-price');
            const disc = row.querySelector('.co-item-discount');
            if (select.value) {
                items.push({
                    item_id: parseInt(select.value),
                    quantity: parseFloat(qty.value) || 1,
                    unit_price: parseFloat(price.value) || 0,
                    discount: parseFloat(disc.value) || 0
                });
            }
        });

        if (items.length === 0) {
            showNotification('warning', 'Внимание', 'Добавьте хотя бы одну позицию');
            return;
        }

        const data = {
            order_number: orderNumber,
            order_date: orderDate,
            order_id: parseInt(clientId),
            executor_id: parseInt(executorId),
            items: items
        };

        const url = editId ? `/api/customer-orders/${editId}` : '/api/customer-orders/';
        const method = editId ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');
            showNotification('success', 'Успех', result.message || 'Заказ сохранён');
            closeModal('customerOrderModal');
            loadCustomerOrders();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function viewCustomerOrder(orderId) {
        if (isViewing) return;
        isViewing = true;
        try {
            const response = await fetch(`/api/customer-orders/${orderId}`, { credentials: 'include' });
            const order = await response.json();
            if (!response.ok) throw new Error(order.message || 'Ошибка');

            let itemsHtml = '';
            if (order.items && order.items.length > 0) {
                itemsHtml = '<table style="width:100%; margin-top:12px;">' +
                    '<thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Скидка</th><th>Сумма</th></tr></thead><tbody>';
                order.items.forEach(i => {
                    const sum = i.quantity * i.unit_price * (1 - i.discount / 100);
                    const itemName = itemsList.find(x => x.item_id === i.item_id)?.name || i.item_id;
                    itemsHtml += `<tr>
                        <td>${itemName}</td>
                        <td>${i.quantity}</td>
                        <td>${i.unit_price} ₽</td>
                        <td>${i.discount}%</td>
                        <td>${sum.toFixed(2)} ₽</td>
                    </tr>`;
                });
                itemsHtml += '</tbody></table>';
            }

            const body = document.querySelector('#customerOrderModal .modal-body');
            body.innerHTML = `
                <p><strong>Номер:</strong> ${order.order_number}</p>
                <p><strong>Дата:</strong> ${order.order_date ? new Date(order.order_date).toLocaleDateString('ru-RU') : '—'}</p>
                <p><strong>Контрагент:</strong> ${order.order_id || '—'}</p>
                <p><strong>Исполнитель:</strong> ${order.executor_id || '—'}</p>
                <p><strong>Сумма:</strong> ${(order.total_amount || 0).toFixed(2)} ₽</p>
                ${itemsHtml}
            `;
            document.getElementById('modalTitle').textContent = 'Информация о заказе';
            document.getElementById('customerOrderForm').style.display = 'none';
            document.getElementById('viewModalFooter').style.display = 'flex';
            openModal('customerOrderModal');
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        } finally {
            isViewing = false;
        }
    }

    async function calculateCost(orderId) {
        try {
            const response = await fetch(`/api/customer-orders/${orderId}/cost-calculation`, {
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');

            let html = `<p><strong>Заказ:</strong> ${result.order_number}</p>`;
            html += `<p><strong>Итого:</strong> ${result.total_amount.toFixed(2)} ₽</p>`;
            if (result.items && result.items.length > 0) {
                html += '<table style="width:100%; margin-top:12px;">' +
                    '<thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Себест.</th><th>Сумма</th></tr></thead><tbody>';
                result.items.forEach(i => {
                    html += `<tr>
                        <td>${i.item_id}</td>
                        <td>${i.quantity}</td>
                        <td>${i.unit_price} ₽</td>
                        <td>${i.cost_price} ₽</td>
                        <td>${i.total.toFixed(2)} ₽</td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }

            document.querySelector('#customerOrderModal .modal-body').innerHTML = html;
            document.getElementById('modalTitle').textContent = 'Расчёт себестоимости';
            document.getElementById('customerOrderForm').style.display = 'none';
            document.getElementById('viewModalFooter').style.display = 'flex';
            openModal('customerOrderModal');
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteCustomerOrder(id) {
        if (!confirm('Удалить заказ?')) return;
        try {
            const response = await fetch(`/api/customer-orders/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');
            showNotification('success', 'Успех', result.message || 'Удалено');
            loadCustomerOrders();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    function resetCustomerOrderModal() {
        document.getElementById('customerOrderForm').style.display = 'block';
        document.getElementById('customerOrderForm').reset();
        document.getElementById('viewModalFooter').style.display = 'none';
        document.getElementById('coItemsContainer').innerHTML = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadCustomerOrders();
        loadItems();
        loadOrdersList();
    });
</script>

<style>
    .modal-body { max-height: 70vh; overflow-y: auto; }
    .modal-body table th, .modal-body table td {
        padding: 6px 8px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 13px;
    }
</style>

<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список заказов покупателей</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddCustomerOrderModal()">+ Добавить заказ</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>№ заказа</th>
                <th>Дата</th>
                <th>Контрагент</th>
                <th>Исполнитель</th>
                <th>Сумма</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="customerOrdersTableBody">
            <tr><td colspan="6" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="customerOrderModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="max-width: 900px; width: 95%;">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить заказ</h3>
            <button class="modal-close" onclick="closeModal('customerOrderModal'); resetCustomerOrderModal();">&times;</button>
        </div>
        <form id="customerOrderForm" onsubmit="saveCustomerOrder(event)">
            <input type="hidden" id="editCustomerOrderId" value="">
            <div class="modal-body">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label class="form-label">Номер</label>
                        <input type="text" id="coNumber" class="form-input" placeholder="Авто">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Дата <span class="required">*</span></label>
                        <input type="date" id="coDate" class="form-input" required>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label class="form-label">Контрагент <span class="required">*</span></label>
                        <select id="coClientId" class="form-input" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Исполнитель (ID) <span class="required">*</span></label>
                        <input type="number" id="coExecutorId" class="form-input" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label class="form-label">Позиции</label>
                    <div id="coItemsContainer"></div>
                    <button type="button" class="btn btn-sm btn-outline"
                        onclick="addCustomerOrderItemRow()" style="margin-top:8px;">+ Добавить позицию</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline"
                    onclick="closeModal('customerOrderModal'); resetCustomerOrderModal();">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
        <div class="modal-footer" id="viewModalFooter" style="display:none;">
            <button class="btn btn-primary"
                onclick="closeModal('customerOrderModal'); resetCustomerOrderModal();">Закрыть</button>
        </div>
    </div>
</div>
{% endblock %}
