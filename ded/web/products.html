{% extends "base-dashboard.html" %}
{% block title %}Продукция{% endblock %}
{% block content %}
<script>
async function loadProducts() {
    const tbody = document.getElementById('productsTableBody');
    try {
        const res = await fetch('/api/items/?item_type=Продукция', { credentials: 'include' });
        const data = await res.json();
        const list = data.items || [];

        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Продукции пока нет</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        list.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>${item.code}</td>
                <td>${item.created_at ? new Date(item.created_at).toLocaleDateString('ru-RU') : '—'}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick='editProduct(${JSON.stringify(item)})'>✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${item.item_id})">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (e) {
        showNotification('error', 'Ошибка', 'Не удалось загрузить продукцию');
    }
}

function openAddProductModal() {
    document.getElementById('modalTitle').textContent = 'Добавить продукцию';
    document.getElementById('editProductId').value = '';
    document.getElementById('productForm').reset();
    openModal('productModal');
}

function editProduct(item) {
    document.getElementById('modalTitle').textContent = 'Редактировать продукцию';
    document.getElementById('editProductId').value = item.item_id;
    document.getElementById('productName').value = item.name || '';
    document.getElementById('productCode').value = item.code || '';
    openModal('productModal');
}

async function saveProduct(event) {
    event.preventDefault();
    const id = document.getElementById('editProductId').value;
    const data = {
        name: document.getElementById('productName').value,
        code: document.getElementById('productCode').value,
        item_type: 'Продукция'
    };
    const url = id ? `/api/items/${id}` : '/api/items/';
    const method = id ? 'PUT' : 'POST';
    try {
        const res = await fetch(url, {
            method, credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.message || 'Ошибка');
        showNotification('success', 'Успех', result.message || 'Сохранено');
        closeModal('productModal');
        loadProducts();
    } catch (e) {
        showNotification('error', 'Ошибка', e.message);
    }
}

async function deleteProduct(id) {
    if (!confirm('Удалить продукцию?')) return;
    try {
        const res = await fetch(`/api/items/${id}`, { method: 'DELETE', credentials: 'include' });
        const result = await res.json();
        if (!res.ok) throw new Error(result.message || 'Ошибка');
        showNotification('success', 'Успех', result.message || 'Удалено');
        loadProducts();
    } catch (e) {
        showNotification('error', 'Ошибка', e.message);
    }
}

document.addEventListener('DOMContentLoaded', loadProducts);
</script>

<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список продукции</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddProductModal()">+ Добавить продукцию</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>Название</th>
                <th>Код</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="productsTableBody">
            <tr><td colspan="4" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="productModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить продукцию</h3>
            <button class="modal-close" onclick="closeModal('productModal')">&times;</button>
        </div>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="editProductId">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Название <span class="required">*</span></label>
                    <input type="text" id="productName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Код <span class="required">*</span></label>
                    <input type="text" id="productCode" class="form-input" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('productModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
