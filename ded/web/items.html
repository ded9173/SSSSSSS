{% extends "base-dashboard.html" %}

{% block title %}Номенклатура{% endblock %}
{% block content %}
<script>
    let allItems = [];
    let currentFilter = 'all';

    async function loadItems() {
        try {
            const response = await fetch('/api/items/', { credentials: 'include' });
            const data = await response.json();
            allItems = data.items || [];
            renderItems();
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить номенклатуру');
        }
    }

    function renderItems() {
        const tbody = document.getElementById('itemsTableBody');
        const filtered = currentFilter === 'all'
            ? allItems
            : allItems.filter(i => i.item_type === currentFilter);

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Записей пока нет</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        filtered.forEach(item => {
            const typeClass = item.item_type === 'Продукция' ? 'status-done'
                            : item.item_type === 'Материалы' ? 'status-progress'
                            : 'status-new';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>${item.code}</td>
                <td><span class="status-badge ${typeClass}">${item.item_type}</span></td>
                <td>${item.created_at ? new Date(item.created_at).toLocaleDateString('ru-RU') : '—'}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick='editItem(${JSON.stringify(item)})'>✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.item_id})">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterItems(type) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.filter-btn[data-type="${type}"]`)?.classList.add('active');
        renderItems();
    }

    function openAddItemModal() {
        document.getElementById('modalTitle').textContent = 'Добавить запись';
        document.getElementById('editItemId').value = '';
        document.getElementById('itemForm').reset();
        openModal('itemModal');
    }

    function editItem(item) {
        document.getElementById('modalTitle').textContent = 'Редактировать запись';
        document.getElementById('editItemId').value = item.item_id;
        document.getElementById('itemName').value = item.name || '';
        document.getElementById('itemCode').value = item.code || '';
        document.getElementById('itemType').value = item.item_type || 'Продукция';
        openModal('itemModal');
    }

    async function saveItem(event) {
        event.preventDefault();
        const id = document.getElementById('editItemId').value;
        const data = {
            name: document.getElementById('itemName').value,
            code: document.getElementById('itemCode').value,
            item_type: document.getElementById('itemType').value,
        };

        const url = id ? `/api/items/${id}` : '/api/items/';
        const method = id ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');
            showNotification('success', 'Успех', result.message || 'Сохранено');
            closeModal('itemModal');
            loadItems();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteItem(id) {
        if (!confirm('Удалить запись?')) return;
        try {
            const response = await fetch(`/api/items/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');
            showNotification('success', 'Успех', result.message || 'Удалено');
            loadItems();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadItems);
</script>

<style>
    .filter-btn {
        padding: 6px 14px;
        border: 1px solid var(--color-border);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 6px;
        font-size: 13px;
    }
    .filter-btn.active {
        background: var(--color-primary);
        color: #fff;
        border-color: var(--color-primary);
    }
    .status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
    }
    .status-done { background: #d1fae5; color: #065f46; }
    .status-progress { background: #fef3c7; color: #92400e; }
    .status-new { background: #dbeafe; color: #1e40af; }
</style>

<div class="data-table">
    <div class="table-header">
        <div class="table-title">Номенклатура (Продукция / Материалы / Операции)</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddItemModal()">+ Добавить</button>
        </div>
    </div>

    <div style="padding: 12px 16px; border-bottom: 1px solid var(--color-border);">
        <button class="filter-btn active" data-type="all" onclick="filterItems('all')">Все</button>
        <button class="filter-btn" data-type="Продукция" onclick="filterItems('Продукция')">Продукция</button>
        <button class="filter-btn" data-type="Материалы" onclick="filterItems('Материалы')">Материалы</button>
        <button class="filter-btn" data-type="Операция" onclick="filterItems('Операция')">Операции</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Наименование</th>
                <th>Код</th>
                <th>Тип</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="itemsTableBody">
            <tr><td colspan="5" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="itemModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить запись</h3>
            <button class="modal-close" onclick="closeModal('itemModal')">&times;</button>
        </div>
        <form id="itemForm" onsubmit="saveItem(event)">
            <input type="hidden" id="editItemId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Наименование <span class="required">*</span></label>
                    <input type="text" id="itemName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Код <span class="required">*</span></label>
                    <input type="text" id="itemCode" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Тип <span class="required">*</span></label>
                    <select id="itemType" class="form-input" required>
                        <option value="Продукция">Продукция</option>
                        <option value="Материалы">Материалы</option>
                        <option value="Операция">Операция</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('itemModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
