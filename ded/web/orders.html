{% extends "base-dashboard.html" %}

{% block title %}Контрагенты{% endblock %}
{% block content %}
<script>
    async function loadOrders() {
        try {
            const response = await fetch('/api/orders/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('ordersTableBody');
            const list = data.orders || [];

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Контрагентов пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            list.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.name}</td>
                    <td>${c.inn || '—'}</td>
                    <td>${c.address || '—'}</td>
                    <td>${c.phone || '—'}</td>
                    <td>${c.type || '—'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick='editOrder(${JSON.stringify(c)})'>✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteOrder(${c.order_id})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить контрагентов');
        }
    }

    function openAddOrderModal() {
        document.getElementById('modalTitle').textContent = 'Добавить контрагента';
        document.getElementById('editOrderId').value = '';
        document.getElementById('orderForm').reset();
        openModal('orderModal');
    }

    function editOrder(c) {
        document.getElementById('modalTitle').textContent = 'Редактировать контрагента';
        document.getElementById('editOrderId').value = c.order_id;
        document.getElementById('ordName').value = c.name || '';
        document.getElementById('ordInn').value = c.inn || '';
        document.getElementById('ordAddress').value = c.address || '';
        document.getElementById('ordPhone').value = c.phone || '';
        document.getElementById('ordType').value = c.type || 'Клиент';
        openModal('orderModal');
    }

    async function saveOrder(event) {
        event.preventDefault();
        const id = document.getElementById('editOrderId').value;
        const data = {
            name: document.getElementById('ordName').value,
            inn: document.getElementById('ordInn').value,
            address: document.getElementById('ordAddress').value,
            phone: document.getElementById('ordPhone').value,
            type: document.getElementById('ordType').value,
        };

        const url = id ? `/api/orders/${id}` : '/api/orders/';
        const method = id ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');
            showNotification('success', 'Успех', result.message || 'Сохранено');
            closeModal('orderModal');
            loadOrders();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteOrder(id) {
        if (!confirm('Удалить контрагента?')) return;
        try {
            const response = await fetch(`/api/orders/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Ошибка');
            showNotification('success', 'Успех', result.message || 'Удалено');
            loadOrders();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
</script>

<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список контрагентов</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddOrderModal()">+ Добавить контрагента</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>Наименование</th>
                <th>ИНН</th>
                <th>Адрес</th>
                <th>Телефон</th>
                <th>Тип</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="ordersTableBody">
            <tr><td colspan="6" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="orderModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить контрагента</h3>
            <button class="modal-close" onclick="closeModal('orderModal')">&times;</button>
        </div>
        <form id="orderForm" onsubmit="saveOrder(event)">
            <input type="hidden" id="editOrderId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Наименование <span class="required">*</span></label>
                    <input type="text" id="ordName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ИНН</label>
                    <input type="text" id="ordInn" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Адрес</label>
                    <input type="text" id="ordAddress" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="text" id="ordPhone" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Тип <span class="required">*</span></label>
                    <select id="ordType" class="form-input" required>
                        <option value="Клиент">Клиент</option>
                        <option value="Поставщик">Поставщик</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('orderModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
